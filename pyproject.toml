[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msaad"
version = "1.0.0"
description = "Multiscale Average Absolute Difference (MSAAD): a fast, nonparametric multiscale complexity feature for noisy wearable time series."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jamison H. Burks", email = "jburks@ucsd.edu" }]
keywords = [
    "time series", "complexity", "wearables", "line length", "sample entropy",
    "multiscale", "fractal", "physiology", "diabetes", "aging",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "statsmodels>=0.13",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "pyarrow>=10.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
# Optional cross-validation against reference implementations of the baselines.
reference = ["neurokit2>=0.2", "antropy>=0.1"]
dev = ["pytest>=7.0", "jupyter>=1.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/jamisonhburks/msaad"
Repository = "https://github.com/jamisonhburks/msaad"
Paper = "https://doi.org/10.3390/a18090577"
Issues = "https://github.com/jamisonhburks/msaad/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]  # pycodestyle, pyflakes, isort, pyupgrade
ignore = ["RUF022"]                  # keep __all__ in logical (not alphabetical) order

[tool.ruff.lint.isort]
known-first-party = ["msaad"]
